<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영어 단어장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어장">
<meta name="theme-color" content="#f6f8fa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#f6f8fa; --card:#ffffff; --border:#d0d7de; --line:#e6e9ed;
  --text:#1f2328; --muted:#57606a;
  --green:#1a7f37; --green-soft:rgba(26,127,55,.10);
  --blue:#0969da; --blue-soft:rgba(9,105,218,.09);
  --amber:#8a5d00; --amber-soft:rgba(154,103,0,.12);
  --red:#cf222e;
  --shadow:0 1px 2px rgba(31,35,40,.05),0 4px 14px rgba(31,35,40,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,.card .desc,.hint{word-break:keep-all;overflow-wrap:anywhere}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
header img{width:52px;height:52px;border-radius:12px;box-shadow:var(--shadow)}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--muted);font-size:.95rem}

.hint{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--blue-soft);border:1px solid rgba(9,105,218,.25);color:#0a3069;
  border-radius:12px;padding:12px 14px;margin-bottom:22px;font-size:.93rem
}
.hint[hidden]{display:none}
.hint b{white-space:nowrap}
.hint button{
  margin-left:auto;flex:none;border:0;background:transparent;color:inherit;
  font:inherit;font-size:1.25rem;line-height:1;padding:2px 4px;cursor:pointer
}

section{margin-top:26px}
h2{
  display:flex;align-items:baseline;gap:8px;
  margin:0 0 10px;font-size:1.02rem;color:var(--muted);font-weight:700
}
h2 small{font-weight:500;font-size:.85rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{
  position:relative;display:flex;flex-direction:column;gap:4px;min-height:96px;
  padding:16px 40px 16px 16px;border-radius:14px;
  background:var(--card);border:1.5px solid var(--border);box-shadow:var(--shadow);
  color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;
  transition:transform .08s ease,border-color .15s ease
}
.card:active{transform:scale(.98);border-color:var(--green)}
@media (hover:hover){.card:hover{border-color:var(--green)}}
.card strong{font-size:1.12rem;letter-spacing:-.01em}
.card .desc{color:var(--muted);font-size:.9rem}
.card .arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1.6rem;color:var(--border)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.tag.test{background:var(--amber-soft);color:var(--amber)}
.tag.new{background:var(--red);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;
  background:var(--card);border:1.5px solid var(--border);color:var(--text);
  text-decoration:none;font-weight:600;font-size:.95rem;-webkit-tap-highlight-color:transparent
}
.chip:active{border-color:var(--green);background:var(--green-soft)}
.sub{margin:14px 0 0;color:var(--muted);font-size:.85rem}

footer{margin-top:36px;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon.png" alt="">
    <div>
      <h1>영어 단어장</h1>
      <p>오늘 외울 범위를 골라서 바로 연습해요</p>
    </div>
  </header>

  <div class="hint" id="hint" hidden>
    <div>📌 <b>앱처럼 쓰려면</b> 위쪽 공유 버튼(⬆︎)을 누르고 <b>‘홈 화면에 추가’</b>를 고르세요. 그다음부터는 홈 화면의 ‘단어장’ 아이콘으로 열면 돼요.</div>
    <button type="button" id="hint-close" aria-label="닫기">×</button>
  </div>

  <main id="list"></main>

  <footer>한 번 열어 본 앱은 인터넷이 없어도 열려요</footer>
</div>

<script>
/* ───────── 앱 목록 ─────────
   새 앱을 추가할 때: apps 폴더에 HTML을 넣고 아래 APPS에 한 줄 추가 (sw.js의 APP_FILES에도 추가) */
const SECTIONS = [
  { id:'day',   title:'어원 Day 단어장', note:'학원 시험 범위(2일치)' },
  { id:'read',  title:'독해 단어',       note:'구조독해 · 모의고사 지문' },
  { id:'book',  title:'수능 어휘 교재',   note:'UNIT별 40단어' }
];

const APPS = [
  { sec:'day',  href:'apps/day51-52.html',     title:'Day 51–52',          desc:'48단어 · 뜻 보고 단어 + 동의어·반의어',          tags:['시험형'], added:'2026-11-24' },
  { sec:'day',  href:'apps/day49-50.html',     title:'Day 49–50',          desc:'47단어 · 뜻 보고 단어 + 동의어·반의어',          tags:['시험형'], added:'2026-11-23' },
  { sec:'day',  href:'apps/day41-44.html',     title:'Day 41–44',          desc:'96단어 · 뜻 보고 단어 + 동의어·반의어',          tags:['시험형'], added:'2026-11-21' },

  { sec:'read', href:'apps/gujo-1.html',       title:'구조독해 단어 1',     desc:'22단어 · 스펠링·예문퀴즈·실전테스트',       tags:['시험형'], added:'2026-11-22' },
  { sec:'read', href:'apps/dokhae-1102.html',  title:'11/2 독해 단어',      desc:'제목·주제 추론 6개 지문 · 44단어',          tags:[],         added:'2026-11-01' },
  { sec:'read', href:'apps/renewable.html',    title:'재생에너지 독해 단어', desc:'2020년 11월 23번 지문 · 29단어',            tags:[],         added:'2026-11-01' },

  { sec:'book', href:'apps/root-unit19.html',  title:'UNIT 19 어근',        desc:'형성·변화·취득·유지 · 40단어',              tags:['시험형'], added:'2026-11-21' },
  { sec:'book', href:'apps/root-unit18.html',  title:'UNIT 18 어근',        desc:'시청각·언어·기록 · 40단어',                 tags:['시험형'], added:'2026-11-13' },
  { sec:'book', href:'apps/suffix-unit16.html',title:'UNIT 16 접미사',      desc:'품사를 바꾸는 접미사 · 40단어',             tags:[],         added:'2026-11-06' }
];

/* 예전에 따로 올려 둔 교재 단원 (각자 별도 주소) */
const OLD_UNITS = [
  { label:'UNIT 1–12', href:'https://hannaforms.github.io/unit1_12/vocab_study_unit1_12.html' },
  { label:'UNIT 14',   href:'https://hannaforms.github.io/voca14/vocab_quiz_UNIT14.html' },
  { label:'UNIT 15',   href:'https://hannaforms.github.io/voca15/vocab_quiz_UNIT15.html' },
  { label:'UNIT 17',   href:'https://hannaforms.github.io/voca17/vocab_quiz_UNIT17.html' },
  { label:'UNIT 20',   href:'https://hannaforms.github.io/voca20/vocab_quiz_UNIT20.html' },
  { label:'UNIT 21',   href:'https://hannaforms.github.io/voca21/vocab_quiz_UNIT21.html' },
  { label:'UNIT 22',   href:'https://hannaforms.github.io/voca22/vocab_quiz_UNIT22.html' },
  { label:'UNIT 23',   href:'https://hannaforms.github.io/voca23/vocab_quiz_UNIT23.html' }
];

const NEW_DAYS = 7; // 추가한 지 이 기간 안이면 NEW 표시

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isNew(d){
  const t = Date.parse(d + 'T00:00:00+09:00');
  return !isNaN(t) && (Date.now() - t) < NEW_DAYS * 864e5;
}

function render(){
  const main = document.getElementById('list');
  let html = '';
  for (const s of SECTIONS){
    const items = APPS.filter(a => a.sec === s.id)
                      .sort((a,b) => b.added.localeCompare(a.added));
    html += `<section><h2>${esc(s.title)} <small>${esc(s.note)}</small></h2><div class="grid">`;
    for (const a of items){
      let tags = '';
      if (isNew(a.added)) tags += '<span class="tag new">NEW</span>';
      for (const t of a.tags) tags += `<span class="tag test">${esc(t)}</span>`;
      html += `<a class="card" href="${esc(a.href)}">`
            + (tags ? `<span class="tags">${tags}</span>` : '')
            + `<strong>${esc(a.title)}</strong><span class="desc">${esc(a.desc)}</span>`
            + `<span class="arrow" aria-hidden="true">›</span></a>`;
    }
    html += '</div>';
    if (s.id === 'book'){
      html += '<p class="sub">지난 단원</p><div class="chips">'
            + OLD_UNITS.map(u => `<a class="chip" href="${esc(u.href)}">${esc(u.label)}</a>`).join('')
            + '</div>';
    }
    html += '</section>';
  }
  main.innerHTML = html;
}
render();

/* Safari에서 열었을 때만 '홈 화면에 추가' 안내 */
(function(){
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  let dismissed = false;
  try { dismissed = localStorage.getItem('hub-hint-closed') === '1'; } catch(e){}
  const box = document.getElementById('hint');
  if (isIOS && !standalone && !dismissed) box.hidden = false;
  document.getElementById('hint-close').addEventListener('click', () => {
    box.hidden = true;
    try { localStorage.setItem('hub-hint-closed','1'); } catch(e){}
  });
})();

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
